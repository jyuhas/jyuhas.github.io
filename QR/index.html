<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f5f4; --panel:#ffffff; --ink:#1c1917; --muted:#6b6560; --line:#d6d3d1; --accent:#2563eb; --accent-ink:#ffffff; --err:#b42318;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#171717;--panel:#222222;--ink:#f5f5f4;--muted:#a8a29e;--line:#3f3f3f;--accent:#60a5fa;--accent-ink:#0a0a0a;--err:#ff8a80}
}
:root[data-theme="dark"]{--bg:#171717;--panel:#222222;--ink:#f5f5f4;--muted:#a8a29e;--line:#3f3f3f;--accent:#60a5fa;--accent-ink:#0a0a0a;--err:#ff8a80}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
h1{font-size:1.4rem;margin:0 0 6px}
p.sub{margin:0 0 18px;color:var(--muted);font-size:.95rem}
label{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#err{min-height:1.3em;margin:8px 0 0;color:var(--err);font-size:.9rem}
#result{margin-top:16px;text-align:center}
#result[hidden]{display:none}
#qr{display:inline-block;background:#fff;padding:14px;border-radius:6px;border:1px solid var(--line);line-height:0}
#qr img,#qr canvas{max-width:100%;height:auto}
#shown{margin:12px 0 0;color:var(--muted);font-size:.85rem;word-break:break-all}
.hint{margin:8px 0 0;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>QR code generator</h1>
  <p class="sub">Enter a web address to get a code you can scan.</p>
  <label for="url">Web address</label>
  <div class="row">
    <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="https://example.com">
    <button id="go" type="button">Generate</button>
  </div>
  <p id="err" role="alert"></p>
  <div id="result" hidden>
    <div id="qr"></div>
    <p id="shown"></p>
    <p class="hint">Press and hold the code (or right-click) to save the image.</p>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var input=document.getElementById('url'), err=document.getElementById('err'),
      result=document.getElementById('result'), box=document.getElementById('qr'),
      shown=document.getElementById('shown');

  function normalize(v){
    v=v.trim();
    if(!v) return null;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v='https://'+v;
    try{
      var u=new URL(v);
      if(!/^https?:$/.test(u.protocol)||u.hostname.indexOf('.')<1) return null;
      return u.href;
    }catch(e){return null}
  }

  function generate(){
    var href=normalize(input.value);
    if(!href){
      err.textContent=input.value.trim()?'That doesn\u2019t look like a web address. Try something like example.com.':'Enter a web address first.';
      result.hidden=true; return;
    }
    err.textContent='';
    try{
      box.innerHTML='';
      new QRCode(box,{text:href,width:240,height:240,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      shown.textContent=href;
      result.hidden=false;
    }catch(e){
      err.textContent='That address is too long to fit in a QR code. Try a shorter one.';
      result.hidden=true;
    }
  }

  document.getElementById('go').addEventListener('click',generate);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')generate()});
})();
</script>
</body>
</html>
